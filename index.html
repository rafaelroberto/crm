### O que foi corrigido e implementado nesta versão (V.1.3.1):

1. **Correção dos Botões:** Todos os botões, seletores, abas e modais tiveram suas chamadas JavaScript e funções preenchidas no `<script>`, resolvendo a travamento das ações.
2. **Seleção de Estado (UF) e Cidade:**
   * O campo de **Estado (UF)** do cadastro agora é um `<select>` com todas as 27 unidades federativas do Brasil.
   * Adicionado o campo **Cidade** obrigatório no formulário de auto-cadastro.
3. **Cancelamento de Assinatura pelo Cliente:**
   * Na aba **Minha Assinatura**, o cliente pode clicar em **"Cancelar Assinatura"** a qualquer momento.
4. **Controle Avançado no Painel SuperAdmin (SaaS Owner):**
   * Você pode **Pausar**, **Bloquear** ou **Cancelar** a assinatura de qualquer empresa cadastrada diretamente na tabela Master, além de alterar os planos.

### SQL do Supabase (Execute no SQL Editor antes de rodar)

Caso ainda não tenha adicionado os novos campos de endereço e controle de status no Supabase, rode esta instrução:

```sql
-- 1. Criar a tabela de Tenants
CREATE TABLE IF NOT EXISTS tenants (
    id TEXT PRIMARY KEY,
    name TEXT NOT NULL,
    cnpj TEXT,
    city TEXT,
    uf VARCHAR(2),
    plan TEXT DEFAULT 'Basic',
    status TEXT DEFAULT 'Active', -- 'Active', 'Paused', 'Canceled'
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- 2. Adicionar os novos campos caso a tabela já exista
ALTER TABLE tenants ADD COLUMN IF NOT EXISTS city TEXT;
ALTER TABLE tenants ADD COLUMN IF NOT EXISTS uf VARCHAR(2);

-- 3. Adicionar tenant_id em todas as tabelas
ALTER TABLE users ADD COLUMN IF NOT EXISTS tenant_id TEXT REFERENCES tenants(id);
ALTER TABLE funnels ADD COLUMN IF NOT EXISTS tenant_id TEXT REFERENCES tenants(id);
ALTER TABLE accounts ADD COLUMN IF NOT EXISTS tenant_id TEXT REFERENCES tenants(id);
ALTER TABLE contacts ADD COLUMN IF NOT EXISTS tenant_id TEXT REFERENCES tenants(id);
ALTER TABLE deals ADD COLUMN IF NOT EXISTS tenant_id TEXT REFERENCES tenants(id);
ALTER TABLE tasks ADD COLUMN IF NOT EXISTS tenant_id TEXT REFERENCES tenants(id);

-- 4. Registrar Master Tenant
INSERT INTO tenants (id, name, cnpj, city, uf, plan, status)
VALUES ('master_1', 'Master IA-CRM', '00000000000100', 'Goiânia', 'GO', 'Enterprise', 'Active')
ON CONFLICT (id) DO NOTHING;

-- 5. Vincular Admin Master
UPDATE users SET tenant_id = 'master_1' WHERE email = 'rafaelroberto@gmail.com';
