<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Funil de Vendas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>Oportunidade de Venda</h2>
    
    <!-- Exibição do perfil logado -->
    <div class="status-usuario">
      <span>Usuário Logado: </span>
      <span id="badge-perfil" class="badge">--</span>
    </div>

    <form id="form-oportunidade">
      <!-- Campo Nome do Cliente -->
      <div class="form-group">
        <label for="cliente">Nome do Cliente:</label>
        <input type="text" id="cliente" placeholder="Digite o nome do cliente" required>
      </div>

      <!-- Campo Seleção do Funil -->
      <div class="form-group">
        <label for="select-funil">Funil de Vendas:</label>
        <select id="select-funil">
          <!-- Opções inseridas dinamicamente pelo JS -->
        </select>
        <span id="mensagem-permissao" class="aviso"></span>
      </div>

      <button type="submit">Salvar Oportunidade</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
